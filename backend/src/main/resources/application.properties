spring.application.name=parlour-api
server.port=${PORT:8080}
# Firestore is the only database: no JDBC DataSource, no Flyway, ever.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
app.jwt-secret=${JWT_SECRET}
app.firebase-project=parlour-booking-management
app.firebase-bucket=parlour-booking-management.firebasestorage.app
app.public-url=${PUBLIC_API_URL:http://localhost:8080}
app.ssl-store-id=${SSLCOMMERZ_STORE_ID:}
app.ssl-store-password=${SSLCOMMERZ_STORE_PASSWORD:}
app.ssl-live=${SSLCOMMERZ_LIVE:false}
app.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.cors-origins=${CORS_ALLOWED_ORIGINS:}
# Password-reset email over SMTP (e.g. Gmail: SMTP_HOST=smtp.gmail.com, SMTP_PORT=587,
# SMTP_USERNAME=you@gmail.com, SMTP_PASSWORD=<Google app password>, MAIL_FROM=you@gmail.com).
# While SMTP_HOST is empty the backend runs in dev mode: reset links are written to the backend log instead of emailed.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail-from=${MAIL_FROM:}
